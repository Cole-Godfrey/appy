name: Feature request
description: Propose a workflow or integration change.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is difficult today? Use a concrete example without personal data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include required services, permissions, and costs if known.
    validations:
      required: true
