name: Bug report
description: Report a reproducible failure with synthetic data.
body:
  - type: markdown
    attributes:
      value: Do not include applicant data, account screenshots, raw mail, tokens, or logs. Use SECURITY.md for private reports.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commands or steps, expected result, and actual result.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and Codex/connector version if relevant.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I replaced personal data and credentials with fictional examples.
          required: true
